title: Delayclaim
description: 'EU261/UK261 flight compensation, computed and tracked. Given the route, the scheduled and actual
  arrival and the party size, delayclaim measures the great-circle distance from a bundled offline table of
  7,918 airports (connections summed, Article 7(1)), applies the Article 7 distance band (EUR 250/400/600, or
  GBP 220/350/520), the three-hour Sturgeon threshold, the fourteen-day cancellation window and the
  extraordinary-circumstances defence, and returns the amount per passenger and for the party with the
  articles it relied on. It then drafts the formal claim letter and keeps a local case file with the
  enforcement follow-up and the two-year limitation date. The engine is deterministic and offline: the verdict
  is computed, never narrated, so the same flight always produces the same figure. Six tools, no hooks,
  middleware or env vars. Disclosure — no network calls, no Python dependencies and no subprocess: it reads
  its own bundled airport and country tables, writes drafts and case rows under plugin-data/delayclaim/, and
  sends nothing to an airline; you review and send the letter yourself.'
