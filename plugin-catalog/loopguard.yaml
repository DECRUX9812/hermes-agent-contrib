version: "0.1.0"
title: LoopGuard
description: >-
  Stops cron and kanban automations from paying a big model to look at unchanged state. A zero-token
  change gate skips unchanged polls, a cheap typed semantic gate (TypeSafe Jev, any OpenAI-compatible
  model, the Hermes auxiliary task or local heuristics) triages new items, and a tool gate, completion
  check and spend caps stop runaway loops. Optional computer-use gates and a jev_computer tool put
  screenshot checks on cheap typed calls. Settings are in Settings > Plugins.
  Disclosure: network calls only to the backends you configure (TypeSafe when a key is set, your
  OpenAI-compatible endpoint, the Hermes aux model); no telemetry. Runs the watcher source commands
  and GOAL.md checks you write (argument lists, no shell), hermes cron/kanban create, and the
  cua-driver CLI for computer use (off by default). Data and config stay under HERMES_HOME; the
  TypeSafe key is a config_schema secret read through Hermes. No background processes.
