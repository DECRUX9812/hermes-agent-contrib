description: >-
  A picture behind your Hermes Desktop chat without changing your theme. A status-bar
  picker offers Plain, Daily inspiration, your own uploaded photo, and a gallery whose new
  drops arrive as data (a backdrops.json manifest of images), never as code. Bundled art,
  a cached gallery, and your stored photo keep it working offline. Paints only through the
  documented [data-chat-surface] styling hook; state lives in plugin storage.
