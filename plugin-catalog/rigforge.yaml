title: Rigforge
description: >-
  A build studio for robots, printed machines and controller boards, inside Hermes
  Desktop. Say a sentence — or click a card — and get the whole build: posed 3D
  geometry with real forward kinematics and an exploded view, joint torque sizing
  that picks real servos (or a belt stage when one cannot, and says so when nothing
  can), a per-rail power budget with wire gauge and a fuse that never exceeds its
  wire, an ESP32 pin map that refuses strapping and flash pins, firmware generated
  from that same map, and a priced BOM with SKUs, mass, print time and per-part STL
  packs split to fit your printer bed. Before you print anything, the test bench
  drives it: WASD/gamepad/touch teleop for wheels, IK arms, legged gait,
  grippers and the gantry's three chained slide axes (portal/saddle/quill at
  real belt and leadscrew speeds), joints slewing at real servo speeds with
  stall, thermal cutoff and
  battery sag, traction on hardwood to wet ice, porch stairs, a living-room
  course, and AUTO certification scoring every maneuver — with a break→fix line
  when something fails — and every failure lands in the fixes panel as an
  applyable patch where the mechanism is real. Named pose presets (stow,
  carry, wave, prowl) IK onto the live machine, and a joint-load heat overlay
  colours each pivot by measured load/stall. DFM runs on the exact triangles
  the STL pack ships: bed-fit, honest plate packing with per-plate 3MFs and a
  part→plate map, overhang needs support, narrow footprints want a brim, wall
  thickness is raycast-measured, and servo lead runs are measured
  joint-to-home so extension leads land in the BOM before they are needed.
  Exports cover every downstream tool: per-part STL packs with a measured
  build README, plate-ready 3MFs, glTF for engines, STEP solids for
  Fusion/SolidWorks, OpenSCAD modules, URDF/MJCF for simulators, BOM/CPL
  CSVs, spec markdown and JSON, build codes and firmware. The board track
  designs a controller board with placements, solder verdicts and a
  fab/assembly pack (BOM + centroid + spec). Every headline number opens into
  the formula that made it, any change can be compared before/after, and a
  build code carries the whole design in one line.
  Ten preset archetypes from a sensor node to a metre-scale gantry — plus a
  spec-driven 'custom' archetype where the brief's nodes[]/joints[] IS the
  machine (any primitive on any joint chain, servos sized from measured
  gravity torque, IK/gantry teleop self-selected when the spec qualifies).
  Deterministic and fully offline — every number is computed, never narrated.
  Two agent tools
  (rigforge_build, rigforge_state) queue a build and read the spec back, plus
  rigforge_prices for live supplier pricing; a ::rigforge{...} transcript directive
  turns a chat line into a "load into studio" card. Desktop page plus agent tools;
  no hooks, no middleware, no env vars.
