<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hermes Agent — Plugins</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070c22; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; }
      .layer { position: absolute; inset: 0; }
      /* The app window: real footage (1920x1200 px) shown 1280x800 in its slot, camera inside. */
      #halo { position: absolute; left: 420px; top: 40px; width: 1520px; height: 1020px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(242, 181, 59, 0.22) 0%, rgba(242, 181, 59, 0) 70%); opacity: 0; }
      #window { position: absolute; left: 540px; top: 150px; width: 1280px; height: 800px; overflow: hidden; border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16); background: #ffffff; transform-origin: 50% 50%;
        box-shadow: 0 50px 140px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.4);
        --mr: 160%; --mx: 50%; --my: 50%;
        -webkit-mask-image: radial-gradient(circle at var(--mx) var(--my), #000 var(--mr), transparent calc(var(--mr) + 22%));
        mask-image: radial-gradient(circle at var(--mx) var(--my), #000 var(--mr), transparent calc(var(--mr) + 22%)); }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; transform-origin: 0 0; }
      #cam video { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; }
      #flash { position: absolute; inset: 0; background: #f3efe2; opacity: 0; }
      #spark { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, #fff6d6 0%, #f2b53b 45%, rgba(242, 181, 59, 0) 72%); }
      #ring { position: absolute; left: 1180px; top: 550px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%;
        border: 3px solid rgba(143, 182, 255, 0.9); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="35.593" data-width="1920" data-height="1080">
      <div id="bg" class="layer" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="35.593" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="halo"></div>
      <div id="window" data-layout-allow-overflow>
        <div id="cam">
          <!-- Real Hermes Desktop footage. Cuts: open (blue orb) · Pulse · thinking · chart · theme · close. -->
          <video id="v1" src="assets/app.mp4" data-start="0" data-duration="5.085" data-media-start="47.2" data-track-index="1" muted playsinline></video>
          <video id="v2" src="assets/app.mp4" data-start="5.085" data-duration="1.1" data-media-start="2.2" data-playback-rate="2" data-track-index="1" muted playsinline></video>
          <video id="v3" src="assets/app.mp4" data-start="6.185" data-duration="0.8" data-media-start="4.4" data-playback-rate="3.5" data-track-index="1" muted playsinline></video>
          <video id="v4" src="assets/app.mp4" data-start="6.985" data-duration="4.201" data-media-start="7.2" data-track-index="1" muted playsinline></video>
          <video id="v5" src="assets/app.mp4" data-start="11.186" data-duration="1.025" data-media-start="15.6" data-playback-rate="2" data-track-index="1" muted playsinline></video>
          <video id="v6" src="assets/app.mp4" data-start="12.211" data-duration="4.06" data-media-start="17.65" data-track-index="1" muted playsinline></video>
          <video id="v7" src="assets/app.mp4" data-start="16.271" data-duration="1" data-media-start="26.9" data-playback-rate="2.2" data-track-index="1" muted playsinline></video>
          <video id="v8" src="assets/app.mp4" data-start="17.271" data-duration="1.28" data-media-start="29.1" data-playback-rate="2.5" data-track-index="1" muted playsinline></video>
          <video id="v9" src="assets/app.mp4" data-start="18.551" data-duration="3.822" data-media-start="35.75" data-track-index="1" muted playsinline></video>
          <video id="v10" src="assets/app.mp4" data-start="22.373" data-duration="1.15" data-media-start="37" data-playback-rate="2" data-track-index="1" muted playsinline></video>
          <video id="v11" src="assets/app.mp4" data-start="23.523" data-duration="4.952" data-media-start="39.3" data-track-index="1" muted playsinline></video>
          <video id="v12" src="assets/app.mp4" data-start="28.475" data-duration="7.118" data-media-start="45.4" data-track-index="1" muted playsinline></video>
        </div>
        <div id="flash"></div>
      </div>
      <div id="ring"></div>
      <div id="spark"></div>

      <div id="words" class="layer" data-composition-id="words" data-composition-src="compositions/words.html" data-start="0" data-duration="35.593" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="lockup" class="layer" data-composition-id="lockup" data-composition-src="compositions/lockup.html" data-start="31.525" data-duration="4.068" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="fx" class="layer" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="35.593" data-track-index="4" data-width="1920" data-height="1080"></div>

      <audio id="score" src="assets/score.wav" data-start="0" data-duration="35.593" data-track-index="5" data-volume="1"></audio>
    </div>

    <script>
      (() => {
        const W = 1280, H = 800, K = W / 1920
        // Camera: frame footage point (px, py) at zoom z, never showing past the footage edge.
        const cam = (z, px = 960, py = 600) => {
          const s = K * z
          const clamp = (v, lo) => Math.min(0, Math.max(lo, v))
          return { scale: s, x: clamp(W / 2 - px * s, W - 1920 * s), y: clamp(H / 2 - py * s, H - 1200 * s) }
        }
        // Screen position of a footage point under a camera state (window in its slot).
        const onScreen = (c, px, py) => ({ x: 540 + c.x + px * c.scale, y: 150 + c.y + py * c.scale })
        const ORB = [1725, 270], HOME = [1005, 648], BOTTOM = [1005, 1100], CHART = [885, 630]
        const tl = gsap.timeline({ paused: true })

        // Open: the window fills the frame on a close-up of the blue orb, lit out of the dark by a
        // radial mask, then the mask opens and the window settles into its slot.
        const open = cam(3.1, ...ORB)
        tl.set('#window', { scale: 1.5, x: -220, y: -10, borderRadius: 0,
          '--mx': `${open.x + ORB[0] * open.scale}px`, '--my': `${open.y + ORB[1] * open.scale}px`, '--mr': '9%' }, 0)
        tl.to('#window', { '--mr': '14%', duration: 2.034, ease: 'sine.inOut' }, 0)
        tl.to('#window', { '--mr': '160%', duration: 1.2, ease: 'power2.in' }, 2.034)
        tl.fromTo('#cam', open, { ...cam(2.6, ...ORB), duration: 2.034, ease: 'none' }, 0)
        tl.to('#window', { scale: 1, x: 0, y: 0, borderRadius: 18, duration: 1.35, ease: 'expo.inOut' }, 2.034)
        tl.to('#cam', { ...cam(1), duration: 1.35, ease: 'expo.inOut' }, 2.034)
        tl.fromTo('#halo', { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power2.out' }, 2.6)

        // Pulse: ask → it writes the file → the orb pops in.
        tl.set('#cam', cam(1.9, ...HOME), 5.085)
        tl.to('#cam', { ...cam(2.05, ...HOME), duration: 1.1, ease: 'none' }, 5.085)
        tl.set('#cam', cam(1.3, 1060, 430), 6.185)
        tl.to('#cam', { ...cam(1.18, 1060, 430), duration: 0.8, ease: 'none' }, 6.185)
        tl.set('#cam', cam(1.18, 1060, 430), 6.985)
        tl.to('#cam', { ...cam(2.2, ...ORB), duration: 0.55, ease: 'expo.out' }, 7.6)
        tl.to('#cam', { ...cam(2.45, ...ORB), duration: 3.0, ease: 'none' }, 8.15)

        // A spark flies from the words into each plugin as it arrives.
        const spark = (at, target) => {
          tl.fromTo('#spark', { x: 300, y: 600, opacity: 0, scale: 0.6 },
            { keyframes: { x: [300, 900, target.x], y: [600, 380, target.y], opacity: [0, 1, 1], scale: [0.6, 1, 1.2] },
              duration: 0.55, ease: 'power2.inOut', immediateRender: false }, at)
          tl.to('#spark', { opacity: 0, scale: 4, duration: 0.3, ease: 'power2.out' }, at + 0.55)
        }
        spark(6.95, onScreen(cam(1.18, 1060, 430), ...ORB))

        // Thinking: the orb flares.
        tl.set('#cam', cam(1.9, ...BOTTOM), 11.186)
        tl.set('#cam', cam(1), 12.211)
        tl.to('#cam', { ...cam(2.3, ...ORB), duration: 0.6, ease: 'expo.inOut' }, 12.45)
        tl.to('#cam', { ...cam(2.55, ...ORB), duration: 3.2, ease: 'none' }, 13.05)

        // Chart: the chat learns to draw.
        tl.set('#cam', cam(1.9, ...BOTTOM), 16.271)
        tl.set('#cam', cam(1.3, 1000, 760), 17.271)
        tl.set('#cam', cam(2.0, ...CHART), 18.551)
        tl.to('#cam', { ...cam(2.2, ...CHART), duration: 3.82, ease: 'none' }, 18.551)
        spark(18.2, onScreen(cam(2.0, ...CHART), ...CHART))

        // Theme: the whole app turns to a sun print.
        tl.set('#cam', cam(1.9, ...BOTTOM), 22.373)
        tl.set('#cam', cam(1), 23.523)
        spark(23.45, { x: 1180, y: 550 })
        tl.fromTo('#flash', { opacity: 0 }, { keyframes: { opacity: [0, 0.85, 0] }, duration: 0.5, ease: 'power2.out', immediateRender: false }, 23.95)
        tl.fromTo('#ring', { scale: 0.4, opacity: 0.9 }, { scale: 5.2, opacity: 0, duration: 1.1, ease: 'power2.out', immediateRender: false }, 24.0)
        tl.fromTo('#window', { scale: 1 }, { keyframes: { scale: [1, 1.025, 1] }, duration: 0.6, ease: 'power2.out', immediateRender: false }, 24.0)
        tl.to('#cam', { ...cam(1.08, 1000, 640), duration: 4.4, ease: 'none' }, 24.05)

        // Close: one more thought in blue, then the window bows out for the lockup.
        tl.set('#cam', cam(1.8, ...BOTTOM), 28.475)
        tl.to('#cam', { ...cam(2.3, ...ORB), duration: 0.5, ease: 'expo.out' }, 29.6)
        tl.to('#window', { scale: 0.38, y: -230, x: -220, opacity: 0, duration: 0.9, ease: 'expo.in' }, 31.25)
        tl.to('#halo', { opacity: 0, duration: 0.6 }, 31.4)

        window.__timelines['main'] = tl
      })()
    </script>
  </body>
</html>
