<!doctype html>
<html><head><meta charset="UTF-8" /></head><body><template>
      <style>
        #lk-root { position: absolute; inset: 0; font-family: Montserrat, sans-serif; }
        #lk-word { position: absolute; left: 460px; top: 380px; width: 1000px; height: 171px; }
        #lk-sub { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; color: #f2b53b; opacity: 0; }
        #lk-url { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-family: 'Space Mono', monospace; font-size: 30px; color: rgba(243, 236, 220, 0.78); letter-spacing: 0.02em; opacity: 0; }
      </style>
      <div id="lk-root" data-composition-id="lockup" data-width="1920" data-height="1080">
        <img id="lk-word" src="assets/wordmark.png" alt="Hermes Agent" />
        <div id="lk-sub" data-layout-allow-occlusion>You asked. Hermes built it.</div>
        <div id="lk-url" data-layout-allow-occlusion>open source · github.com/DECRUX9812/hermes-agent-contrib</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true })
          tl.fromTo('#lk-word', { scale: 1.6, opacity: 0, filter: 'blur(16px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 0.05)
          tl.fromTo('#lk-sub', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.55)
          tl.fromTo('#lk-url', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 1.0)
          tl.to('#lk-word', { scale: 1.03, duration: 3.4, ease: 'none' }, 0.65)
          window.__timelines['lockup'] = tl
        })()
      </script>
</template></body></html>
