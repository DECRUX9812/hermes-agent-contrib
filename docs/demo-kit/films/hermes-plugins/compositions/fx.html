<!doctype html>
<html><head><meta charset="UTF-8" /></head><body><template>
      <style>
        #fx-root { position: absolute; inset: 0; pointer-events: none; }
        #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: soft-light; opacity: 0.35; }
        #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(4, 7, 20, 0.75) 100%); }
      </style>
      <div id="fx-root" data-composition-id="fx" data-width="1920" data-height="1080">
        <canvas id="grain" width="960" height="540" data-layout-allow-occlusion></canvas>
        <div id="vignette" data-layout-allow-occlusion></div>
      </div>
      <script>
        (() => {
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      }
      const DUR = 35.593
      const tl = gsap.timeline({ paused: true })
      // Film grain: one seeded noise field, re-offset 12 times a second.
      const g = document.getElementById('grain').getContext('2d')
      const noise = document.createElement('canvas'); noise.width = 1024; noise.height = 640
      const nctx = noise.getContext('2d'); const img = nctx.createImageData(1024, 640); const r2 = rng(11)
      for (let i = 0; i < img.data.length; i += 4) { const v = r2() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 70 }
      nctx.putImageData(img, 0, 0)
      const drawGrain = t => {
        const k = Math.floor(t * 12); const rr = rng(1000 + k)
        g.clearRect(0, 0, 960, 540); g.drawImage(noise, -rr() * 64, -rr() * 100)
      }


      const clock = { t: 0 }
      drawGrain(0)
      tl.to(clock, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => drawGrain(clock.t) }, 0)
      window.__timelines['fx'] = tl
        })()
      </script>
</template></body></html>
