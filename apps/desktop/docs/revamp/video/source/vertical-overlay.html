<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Inter; src: url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Bold.woff2) format('woff2'); font-weight: 700; }
html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:Inter;color:#fff;-webkit-font-smoothing:antialiased}
.scrim{position:absolute;left:0;right:0}
.top{position:absolute;left:0;right:0;top:250px;text-align:center}
.k{font-family:JBM;font-size:28px;letter-spacing:.35em;color:#22d3ee;text-transform:uppercase}
.h{font-size:92px;font-weight:850;letter-spacing:-.045em;line-height:.98;margin-top:26px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.g{background:linear-gradient(100deg,#fff,#b9c8ff 30%,#4f7cff 55%,#a78bfa 75%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.bot{position:absolute;left:0;right:0;top:1500px;text-align:center}
.pill{display:inline-block;padding:22px 40px;border-radius:99px;font-size:38px;font-weight:750;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
.s{font-family:JBM;font-size:26px;color:rgba(200,210,255,.6);margin-top:30px;letter-spacing:.06em}
</style></head><body>
<div class="scrim" style="top:0;height:660px;background:linear-gradient(180deg,rgba(4,5,13,.92),rgba(4,5,13,.8) 80%,rgba(4,5,13,0))"></div><div class="scrim" style="top:1280px;height:640px;background:linear-gradient(0deg,rgba(4,5,13,.95),rgba(4,5,13,.82) 75%,rgba(4,5,13,0))"></div>
<div class="top"><div class="k">Hermes · Team Bots</div><div class="h">Your AI agents,<br><span class="g">working as a team.</span></div></div>
<div class="bot"><div class="pill">Roles · Goals · Budgets · Approvals</div><div class="s">open source · hermes-agent</div></div>
</body></html>
