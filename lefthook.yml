pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: ruff check --config ./ruff.pre-commit.toml {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    # Bot Mode has its own catalog (src/plugins/hermes-bots/i18n.ts): fail the
    # commit when a staged file in that plugin adds a hardcoded English literal.
    # Scoped to the plugin's paths so unrelated desktop commits pay nothing.
    - name: lint bots i18n literals
      root: apps/desktop/
      glob: "*src/plugins/hermes-bots/*.{ts,tsx}"
      run: node ./scripts/i18n-bots-literals.mjs {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}
