<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes Team Bots</title>
<style>
@font-face { font-family: Inter; src: url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Regular.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Bold.woff2) format('woff2'); font-weight: 700; }
:root {
  --bg: #04050d; --ink: #f4f6ff; --dim: #9aa3c7; --faint: #5b638a;
  --blue: #4f7cff; --cyan: #22d3ee; --violet: #a78bfa; --pink: #f472b6;
  --amber: #fbbf24; --red: #fb4a6a; --green: #34d399;
  --glass: rgba(255,255,255,0.055); --stroke: rgba(255,255,255,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#world { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.c, .c.bot { position: absolute; transform-origin: center; will-change: transform, opacity; }
.scene { position: absolute; inset: 0; transform-origin: 960px 540px; }

/* background */
#bg { background: var(--bg); }
.blob { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; filter: blur(40px); opacity: .55; }
#grid { position: absolute; left: -50%; right: -50%; top: 55%; height: 140%;
  background-image: linear-gradient(rgba(120,140,255,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(120,140,255,.14) 1px, transparent 1px);
  background-size: 80px 80px; transform-origin: top center; transform: perspective(700px) rotateX(64deg);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 70%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 70%); }
#vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); pointer-events: none; }
#grain { opacity: .09; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#flash { background: #fff; opacity: 0; mix-blend-mode: screen; }
#scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); opacity: .5; pointer-events: none; }

/* type */
.kicker { font-family: JBM; font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: var(--cyan); }
.h1 { font-weight: 800; letter-spacing: -.04em; line-height: .92; }
.grad { background: linear-gradient(100deg, #fff 0%, #b9c8ff 30%, var(--blue) 50%, var(--violet) 70%, var(--pink) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.word { display: inline-block; will-change: transform, opacity, filter; }
.cap { position: absolute; left: 120px; top: 96px; }
.cap .kicker { margin-bottom: 18px; }
.cap .t { font-size: 64px; font-weight: 750; letter-spacing: -.03em; line-height: 1.05; }
.cap .t b { font-weight: 800; }

/* cards */
.glass { background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.03)); border: 1px solid var(--stroke);
  border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter: blur(12px); }
.seat { width: 300px; height: 150px; padding: 22px 24px; }
.seat .row { display: flex; gap: 16px; align-items: center; }
.seat .name { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.seat .role { font-size: 19px; color: var(--dim); margin-top: 2px; }
.bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 18px; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 8px; }
.meta { font-family: JBM; font-size: 15px; color: var(--dim); margin-top: 9px; }
.lead { position: absolute; top: -16px; left: 22px; font-family: JBM; font-size: 14px; font-weight: 700; letter-spacing: .2em;
  padding: 6px 12px; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--violet)); color: #fff; box-shadow: 0 0 30px rgba(79,124,255,.8); }
.open { border-style: dashed; border-width: 2px; background: rgba(255,255,255,.02); }

.bot { width: 64px; height: 64px; border-radius: 20px; position: relative; flex: none; box-shadow: 0 0 30px var(--glow, rgba(79,124,255,.6)), inset 0 2px 0 rgba(255,255,255,.35); }
.bot::before, .bot::after { content: ''; position: absolute; top: 24px; width: 10px; height: 14px; background: #fff; border-radius: 6px; }
.bot::before { left: 17px; } .bot::after { right: 17px; }
.bot.lg { width: 110px; height: 110px; border-radius: 34px; }
.bot.lg::before, .bot.lg::after { top: 40px; width: 16px; height: 24px; border-radius: 9px; }
.bot.lg::before { left: 29px; } .bot.lg::after { right: 29px; }
.bot.empty { background: transparent !important; border: 2px dashed rgba(255,255,255,.35); box-shadow: none; }
.bot.empty::before, .bot.empty::after { display: none; }
.atlas { background: linear-gradient(135deg, #6d8dff, #2c49d8); --glow: rgba(79,124,255,.7); }
.quill { background: linear-gradient(135deg, #c4b1ff, #7c4ddf); --glow: rgba(167,139,250,.7); }
.forge { background: linear-gradient(135deg, #ffd66b, #e08a0b); --glow: rgba(251,191,36,.7); }
.lens  { background: linear-gradient(135deg, #7ff0ff, #0e9fb8); --glow: rgba(34,211,238,.7); }

svg.wires { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; border-radius: 99px; font-size: 28px; font-weight: 650; }
.goal { width: 980px; height: 96px; padding: 0 30px; display: flex; align-items: center; gap: 22px; }
.goal .gt { font-size: 30px; font-weight: 650; flex: 1; letter-spacing: -.01em; }
.goal .gp { font-family: JBM; font-size: 22px; color: var(--dim); width: 170px; text-align: right; }
.goal .gbar { position: absolute; left: 30px; right: 30px; bottom: 14px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
.goal .gbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--cyan)); box-shadow: 0 0 16px var(--cyan); }
.status { font-family: JBM; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; border-radius: 8px; background: rgba(255,255,255,.08); color: var(--dim); }

.col { width: 330px; height: 560px; padding: 22px; }
.col h4 { font-family: JBM; font-size: 18px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; }
.card { width: 290px; padding: 20px 22px; border-radius: 16px; background: linear-gradient(180deg, #1a1f3d, #121630); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.card .ct { font-size: 25px; font-weight: 700; letter-spacing: -.01em; }
.card .crumb { font-family: JBM; font-size: 13px; color: var(--cyan); margin-top: 10px; line-height: 1.45; }
.card .who { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 17px; color: var(--dim); }
.card .who .bot { width: 30px; height: 30px; border-radius: 10px; }
.card .who .bot::before, .card .who .bot::after { top: 11px; width: 5px; height: 7px; border-radius: 3px; }
.card .who .bot::before { left: 8px; } .card .who .bot::after { right: 8px; }

.gauge { width: 300px; height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge svg { width: 200px; height: 200px; }
.gauge .gv { position: absolute; top: 118px; width: 100%; text-align: center; font-size: 44px; font-weight: 800; letter-spacing: -.03em; }
.gauge .gn { font-size: 26px; font-weight: 700; margin-top: 18px; }
.gauge .gs { font-family: JBM; font-size: 16px; color: var(--dim); margin-top: 6px; }

.btn { padding: 16px 30px; border-radius: 14px; font-size: 24px; font-weight: 700; }
.btn.pri { background: linear-gradient(180deg, #5b86ff, #2f5cf2); box-shadow: 0 10px 30px rgba(79,124,255,.5); }
.btn.ghost { background: rgba(255,255,255,.07); color: var(--dim); }
.cursor { width: 44px; height: 44px; }
.cursor-tag { position: absolute; left: 34px; top: 34px; font-size: 18px; font-weight: 700; padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
.toast { padding: 20px 28px; border-radius: 16px; font-size: 24px; font-weight: 650; display: flex; gap: 14px; align-items: center; }
.stamp { font-family: JBM; font-weight: 700; font-size: 64px; letter-spacing: .12em; color: var(--green); border: 6px solid var(--green); padding: 8px 26px; border-radius: 14px; text-shadow: 0 0 30px rgba(52,211,153,.7); box-shadow: 0 0 40px rgba(52,211,153,.5), inset 0 0 30px rgba(52,211,153,.3); }
.bubble { padding: 14px 22px; border-radius: 18px; font-size: 24px; font-weight: 600; white-space: nowrap; }
.orb { width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #9fb6ff 18%, #4f7cff 42%, #6d28d9 75%, transparent 76%);
  box-shadow: 0 0 120px rgba(79,124,255,.9), 0 0 260px rgba(167,139,250,.6); }
.chip { padding: 14px 26px; border-radius: 99px; font-size: 26px; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
.window { width: 1000px; height: 640px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 60px 140px rgba(0,0,0,.8), 0 0 120px rgba(79,124,255,.35); background: #fff; }
.window .bar2 { height: 40px; background: #e9ebf2; display: flex; gap: 9px; align-items: center; padding-left: 16px; }
.window .bar2 i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; } .window .bar2 i:nth-child(2) { background: #febc2e; } .window .bar2 i:nth-child(3) { background: #28c840; }
.window img { display: block; width: 100%; }
.phone { width: 330px; height: 690px; border-radius: 48px; padding: 14px; background: #0c0e18; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 50px 120px rgba(0,0,0,.8), 0 0 90px rgba(167,139,250,.4); overflow: hidden; }
.phone .scr { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #fff; }
.phone img { width: 100%; display: block; }
.mono { font-family: JBM; }
</style>
</head>
<body>
<div id="world">
  <div id="bg" class="layer">
    <div class="blob" id="b1" style="background: radial-gradient(circle, rgba(79,124,255,.55), transparent 62%)"></div>
    <div class="blob" id="b2" style="background: radial-gradient(circle, rgba(167,139,250,.45), transparent 62%)"></div>
    <div class="blob" id="b3" style="background: radial-gradient(circle, rgba(34,211,238,.32), transparent 62%)"></div>
    <div id="grid"></div>
  </div>
  <canvas id="fx" class="layer" width="1920" height="1080"></canvas>
  <div id="stage" class="layer"></div>
  <canvas id="fx2" class="layer" width="1920" height="1080" style="pointer-events:none"></canvas>
  <div id="scan" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="flash" class="layer"></div>
</div>
<script>
// ───────────────────────── helpers ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, p) => a + (b - a) * p
const E = {
  lin: p => p,
  out3: p => 1 - Math.pow(1 - p, 3),
  out5: p => 1 - Math.pow(1 - p, 5),
  in3: p => p * p * p,
  io3: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  expo: p => (p === 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2) },
  elastic: p => (p === 0 || p === 1 ? p : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1)
}
const P = (t, a, b) => clamp((t - a) / (b - a))
const tw = (t, a, b, from, to, e = E.out3) => lerp(from, to, e(P(t, a, b)))
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }
const $ = id => document.getElementById(id)
const stage = $('stage')
function el(parent, cls, html = '', css = {}) {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html
  Object.assign(d.style, css); parent.appendChild(d); return d
}
function S(e, o) {
  const x = o.x ?? 0, y = o.y ?? 0, s = o.s ?? 1, r = o.r ?? 0, sx = o.sx ?? 1, sy = o.sy ?? 1
  const ry = o.ry ?? 0, rx = o.rx ?? 0
  e.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s * sx},${s * sy})`
  e.style.opacity = o.o ?? 1
  e.style.filter = o.blur ? `blur(${o.blur}px)` : (o.filter || 'none')
  e.style.visibility = (o.o ?? 1) <= 0.001 ? 'hidden' : 'visible'
}
function at(e, x, y) { e.style.left = x + 'px'; e.style.top = y + 'px' }
function words(e, text, cls = '') {
  let g = false
  e.innerHTML = text.split(' ').map(w => {
    const open = w.startsWith('*'), close = w.endsWith('*')
    if (open) g = true
    const html = `<span class="word ${cls} ${g ? 'grad' : ''}">${w.replace(/\*/g, '')}</span>`
    if (close) g = false
    return html
  }).join(' ')
  return [...e.querySelectorAll('.word')]
}
// Scale a scene's content (not its caption) about a focal point.
function zoom(s, z, ox, oy) {
  const box = document.createElement('div'); box.className = 'layer'
  box.style.transformOrigin = `${ox}px ${oy}px`; box.style.transform = `scale(${z})`
  ;[...s.children].filter(c => !c.classList.contains('cap')).forEach(c => box.appendChild(c)); s.appendChild(box)
}
// Blur-rise reveal for a list of word spans.
function reveal(ws, t, t0, gap = .07, dur = .45, dy = 40) {
  ws.forEach((w, i) => {
    const p = E.out5(P(t, t0 + i * gap, t0 + i * gap + dur))
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * dy}px)`; w.style.filter = `blur(${(1 - p) * 14}px)`
  })
}
function scene(a, b, inDur = .35, outDur = .3) {
  const s = el(stage, 'scene'); s._a = a; s._b = b; s._in = inDur; s._out = outDur; scenes.push(s); return s
}
const scenes = []
// Whip transition: in from the right with blur, out to the left with blur.
function envelope(s, t) {
  const pin = E.out5(P(t, s._a, s._a + s._in)), pout = E.in3(P(t, s._b - s._out, s._b))
  const vis = t >= s._a - .001 && t < s._b
  s.style.display = vis ? 'block' : 'none'
  const x = (1 - pin) * 260 - pout * 320
  const blur = (1 - pin) * 18 + pout * 22
  s.style.opacity = vis ? Math.min(pin * 1.4, 1 - pout) : 0
  s.style.transform = `translateX(${x}px) scale(${1 + (1 - pin) * .04 - pout * .03})`
  s.style.filter = blur > .2 ? `blur(${blur}px)` : 'none'
  return vis
}

// ───────────────────────── particles ─────────────────────────
const fx = $('fx').getContext('2d'), fx2 = $('fx2').getContext('2d')
const DUST = (() => { const r = rng(7); return Array.from({ length: 140 }, () => ({ x: r() * 1920, y: r() * 1080, z: .3 + r() * .9, p: r() * 6.28 })) })()
const bursts = []
function burst(t0, x, y, n = 160, speed = 900, hue = [220, 280], seed = 1, ctx = 2) {
  const r = rng(seed); bursts.push({ t0, x, y, ctx, parts: Array.from({ length: n }, () => ({ a: r() * 6.283, v: speed * (.25 + r() * .9), h: lerp(hue[0], hue[1], r()), sz: 1 + r() * 3.5, life: .7 + r() * 1.1 })) })
}
function drawFx(t) {
  fx.clearRect(0, 0, 1920, 1080); fx2.clearRect(0, 0, 1920, 1080)
  fx.globalCompositeOperation = 'lighter'
  for (const d of DUST) {
    const x = (d.x + t * 18 * d.z) % 1920, y = (d.y - t * 10 * d.z + 1080) % 1080
    const a = .18 + .18 * Math.sin(t * 1.3 + d.p)
    fx.fillStyle = `rgba(160,180,255,${a * d.z})`; fx.beginPath(); fx.arc(x, y, 1.4 * d.z, 0, 6.283); fx.fill()
  }
  for (const b of bursts) {
    const dt = t - b.t0; if (dt < 0 || dt > 2.4) continue
    const c = b.ctx === 2 ? fx2 : fx; c.globalCompositeOperation = 'lighter'
    for (const q of b.parts) {
      if (dt > q.life) continue
      const k = 1 - Math.exp(-dt * 3.2)
      const d = q.v * k / 3.2
      const x = b.x + Math.cos(q.a) * d, y = b.y + Math.sin(q.a) * d + dt * dt * 40
      const al = (1 - dt / q.life) ** 1.5
      c.fillStyle = `hsla(${q.h},95%,70%,${al})`; c.beginPath(); c.arc(x, y, q.sz * (1 - dt / q.life * .5), 0, 6.283); c.fill()
      c.fillStyle = `hsla(${q.h},95%,70%,${al * .15})`; c.beginPath(); c.arc(x, y, q.sz * 5, 0, 6.283); c.fill()
    }
  }
}

// ───────────────────────── background ─────────────────────────
function drawBg(t) {
  const b1 = $('b1'), b2 = $('b2'), b3 = $('b3')
  b1.style.transform = `translate(${-300 + Math.sin(t * .31) * 260}px, ${-500 + Math.cos(t * .27) * 180}px)`
  b2.style.transform = `translate(${900 + Math.cos(t * .23) * 300}px, ${-200 + Math.sin(t * .35) * 220}px)`
  b3.style.transform = `translate(${300 + Math.sin(t * .19 + 2) * 400}px, ${200 + Math.cos(t * .29) * 200}px)`
  $('grid').style.backgroundPosition = `0 ${t * 60}px`
  $('grid').style.opacity = .55 + .25 * Math.sin(t * .5)
  const r = rng(Math.floor(t * 24) + 1)
  $('grain').style.backgroundPosition = `${Math.floor(r() * 300)}px ${Math.floor(r() * 300)}px`
}

// ───────────────────────── scenes ─────────────────────────
// Beat grid: 120 BPM → one bar every 2s. Cuts land on bar lines; the drop is at 4.0s.

// 1 · HOOK (0–4)
const s1 = scene(0, 4, .01, .12)
const h1a = el(s1, 'c h1', '', { fontSize: '118px', left: '960px', top: '470px', whiteSpace: 'nowrap' })
const h1aw = words(h1a, 'Your AI works <span class="word" id="alone">alone.</span>')
h1a.innerHTML = 'Your AI works <span class="word" id="alone" style="position:relative">alone.<i id="strike" style="position:absolute;left:-6px;right:-6px;top:52%;height:12px;background:var(--red);border-radius:6px;transform-origin:left;transform:scaleX(0);box-shadow:0 0 30px var(--red)"></i></span>'
const h1words = [...h1a.childNodes].filter(n => n.nodeType === 3 ? false : true)
const h1text = words(el(s1, 'c', '', { display: 'none' }), 'x')
const h1b = el(s1, 'c h1', '', { fontSize: '118px', left: '960px', top: '620px', whiteSpace: 'nowrap' })
h1b.innerHTML = 'What if it had a <span class="grad" id="teamword">team?</span>'
const hookWords = (() => { const ws = []; h1a.innerHTML = ['Your', 'AI', 'works'].map(w => `<span class="word">${w}</span>`).join(' ') + ' <span class="word" style="position:relative">alone.<i id="strike" style="position:absolute;left:-6px;right:-6px;top:54%;height:12px;background:var(--red);border-radius:6px;transform-origin:left;transform:scaleX(0);box-shadow:0 0 30px var(--red)"></i></span>'; return [...h1a.querySelectorAll('.word')] })()
const hookB = (() => { h1b.innerHTML = ['What', 'if', 'it', 'had', 'a'].map(w => `<span class="word">${w}</span>`).join(' ') + ' <span class="word grad" style="padding-right:6px">team?</span>'; return [...h1b.querySelectorAll('.word')] })()
function r1(t) {
  reveal(hookWords, t, .15, .16, .5)
  $('strike').style.transform = `scaleX(${tw(t, 1.35, 1.6, 0, 1, E.out3)})`
  const shake = t > 1.35 && t < 1.7 ? Math.sin(t * 90) * 10 * (1 - P(t, 1.35, 1.7)) : 0
  S(h1a, { x: shake, y: tw(t, 1.8, 2.3, 0, -40), o: tw(t, 1.8, 2.3, 1, .35) })
  reveal(hookB, t, 2.0, .12, .5, 50)
  const g = hookB[hookB.length - 1]; g.style.backgroundPosition = `${tw(t, 2.6, 3.6, 100, 0, E.io3)}% 0`
  const zoom = tw(t, 3.45, 4, 1, 9, E.in3)
  S(h1b, { s: zoom, x: -(zoom - 1) * 190, o: tw(t, 3.8, 4, 1, 0, E.lin) })
}

// 2 · TITLE (4–8)
const s2 = scene(4, 8, .01, .35)
const tKick = el(s2, 'c kicker', 'Introducing', { left: '960px', top: '330px', fontSize: '26px' })
const tMain = el(s2, 'c h1', '', { left: '960px', top: '505px', fontSize: '250px', whiteSpace: 'nowrap' })
tMain.innerHTML = [...'TEAM BOTS'].map(ch => `<span class="word grad" style="background-size:1200% 100%">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')
const tLetters = [...tMain.querySelectorAll('.word')]
