known_issues:
  - "Audio/video overviews synthesize per-segment with edge-tts (network required) and need ffmpeg on PATH (plus Pillow for video cards); a ~5-minute episode takes 1-3 minutes end to end."
  - "Context is bounded: ask_context_chars (default 28000) and podcast_context_chars (default 42000) cap source text per call; very large notebooks rely on head+tail digests for generation."
  - "PDF extraction needs the declared pypdf dependency; scanned/image-only PDFs have no text layer and are rejected with guidance."
  - "YouTube sources need public captions (youtube-transcript-api); region-locked or caption-less videos fail with a clear error."
  - "Source auto-labeling prefers the auxiliary.notebook slot (inherits compression by default) and falls back to the main model when the aux route returns non-JSON — labels are best-effort and never block ingestion."
  - "Image sources are described by the vision-capable main model via ctx.llm; a text-only model config degrades to an extraction error, not a crash."
